# Pushing a version tag (git tag v1.2.0 && git push origin v1.2.0) builds a
# release APK and attaches it to a GitHub release, so the latest Android build
# is always one download away. Store builds (signed .aab / .ipa) go through
# EAS; see "Building with EAS" in the README.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    name: Android APK on the GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # No Gradle cache: android/ doesn't exist until prebuild, so there's nothing to key it on.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci && npm run typecheck && npx expo prebuild --platform android --no-install
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "FiveByFive-$GITHUB_REF_NAME.apk"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --title "5×5 Tracker $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "FiveByFive-$GITHUB_REF_NAME.apk" --clobber

# Every push and pull request: typecheck, lint, and build the web app, then
# build installable Android and iOS apps from the same code. The builds are
# attached to the run as artifacts, so anyone can try a change on a device
# without a Mac or Android Studio.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Check and build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist
          retention-days: 7

  android:
    name: Android APK
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      # android/ is generated from app.json (Continuous Native Generation).
      - run: npx expo prebuild --platform android --no-install
      # A release build bundles the JS, so it runs without a dev server. The
      # generated project signs it with the template debug key: fine for
      # sideloading, not for Google Play (that goes through EAS).
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - uses: actions/upload-artifact@v4
        with:
          name: FiveByFive-android
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  ios:
    name: iOS (unsigned .ipa)
    needs: web
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      # ios/ is generated from app.json; prebuild also runs pod install.
      - run: npx expo prebuild --platform ios
      - name: Build unsigned app
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry FiveByFive-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FiveByFive-ios-unsigned
          path: FiveByFive-unsigned.ipa
          retention-days: 30
